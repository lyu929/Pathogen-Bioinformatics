name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.5"
      - run: ruff check src tests
      - run: ruff format --check src tests

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -m "not slow" --cov=pathogenomics --cov-report=term-missing

  pipeline:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Slow validation tests (PyDESeq2 vs Galaxy, full pipeline)
        run: pytest -m slow
      - name: Regenerate results and report
        run: |
          pathogenomics -v run
          test -s reports/REPORT.md
          grep -q "report \*\*exactly\*\*" reports/REPORT.md
      - uses: actions/upload-artifact@v6
        with:
          name: report
          path: |
            reports/
            results/
